<!DOCTYPE html>
<html>
<head>
    <title>Quick API Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .loading { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>
    <h1>Quick Univyx API Test</h1>
    <button onclick="testEndpoints()">Test Key Endpoints</button>
    <div id="results"></div>

    <script>
        const API_BASE = 'https://univyx-backend.onrender.com/univyxApi/v1';
        
        const keyEndpoints = [
            { method: 'GET', url: '/entertainment/articles/', name: 'Articles' },
            { method: 'GET', url: '/entertainment/events/', name: 'Events' },
            { method: 'GET', url: '/entertainment/news/', name: 'News' },
            { method: 'GET', url: '/store/', name: 'Store' },
            { method: 'GET', url: '/academics/universities/', name: 'Universities' },
        ];

        async function testEndpoint(endpoint) {
            try {
                const response = await fetch(`${API_BASE}${endpoint.url}`);
                const data = await response.text();
                return {
                    name: endpoint.name,
                    status: response.status,
                    success: response.ok,
                    data: data.substring(0, 200) + (data.length > 200 ? '...' : '')
                };
            } catch (error) {
                return {
                    name: endpoint.name,
                    status: 'ERROR',
                    success: false,
                    data: error.message
                };
            }
        }

        async function testEndpoints() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="loading">Testing endpoints...</div>';
            
            let html = '';
            for (const endpoint of keyEndpoints) {
                const result = await testEndpoint(endpoint);
                const className = result.success ? 'success' : 'error';
                html += `<div class="result ${className}">
                    <strong>${result.name}</strong>: ${result.status} 
                    <br><small>${result.data}</small>
                </div>`;
            }
            
            resultsDiv.innerHTML = html;
        }
    </script>
</body>
</html>
